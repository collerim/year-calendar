name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Run tests
        run: npm test

      - name: Pin coverage date
        run: node --input-type=module -e 'import { renderWindow } from "./render-window.js"; console.log(`RENDER_DATE=${renderWindow().start}`);' >> "$GITHUB_ENV"

      - name: Ensure holiday cache
        run: npm run refresh-holidays:if-needed -- --date "$RENDER_DATE"

      - name: Validate holiday content
        run: |
          npm run content:validate
          npm run content:gaps:render -- --date "$RENDER_DATE"

      - name: Audit full holiday cache
        run: npm run content:gaps -- --require-provider-data
